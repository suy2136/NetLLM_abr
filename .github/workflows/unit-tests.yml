name: ABR inference unit tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependency-light test requirements
        run: python -m pip install numpy==1.24.4
      - name: Validate public release
        run: python scripts/validate_release.py

